# Builds Bridge.app and publishes a GitHub Release for every v* tag.
# People download Bridge-<version>.dmg (app, installer script, read-me).
# The app's updater downloads Bridge.zip from the latest release and checks
# it against Bridge.zip.sha256. Release notes come from docs/releases/<tag>.md
# when that file exists, otherwise they are generated from the commits.
#
#   git tag v0.3.0 && git push origin v0.3.0

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without v), e.g. 0.3.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache: false

      - name: Install build dependencies
        run: brew install openssl@3 lz4 lzo pkgconf

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          go version

      - name: Test
        run: swift test

      - name: Build OpenVPN
        run: scripts/build-openvpn.sh

      - name: Build Xray (VLESS)
        run: scripts/build-xray.sh

      - name: Build OpenConnect
        run: scripts/build-openconnect.sh

      - name: Build Bridge.app
        run: |
          export VERSION="${VERSION#v}"
          scripts/build.sh

      - name: Package
        run: |
          cd build
          ditto -c -k --keepParent Bridge.app Bridge.zip
          shasum -a 256 Bridge.zip | awk '{print $1}' > Bridge.zip.sha256
          cat Bridge.zip.sha256
          cd ..
          scripts/make-dmg.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION#v}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG" && git push origin "$TAG"
          fi
          NOTES="docs/releases/$TAG.md"
          if [ -f "$NOTES" ]; then NOTES_ARGS=(--notes-file "$NOTES"); else NOTES_ARGS=(--generate-notes); fi
          gh release create "$TAG" \
            "build/Bridge-${TAG#v}.dmg" "build/Bridge-${TAG#v}.dmg.sha256" \
            build/Bridge.zip build/Bridge.zip.sha256 \
            --title "Bridge ${TAG#v}" "${NOTES_ARGS[@]}" --verify-tag --latest
